# macOS-inspired smooth animations

animations {
    enabled = true

    # macOS-like bezier curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = macOS, 0.25, 0.1, 0.25, 1
    bezier = liner, 1, 1, 1, 1

    # Window open/close/move
    animation = windows, 1, 5, overshot, slide
    animation = windowsIn, 1, 5, smoothIn, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, macOS

    # Borders
    animation = border, 1, 10, default
    animation = borderangle, 1, 40, liner, loop

    # Fading
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn

    # Workspaces — vertical slide like macOS Mission Control
    animation = workspaces, 1, 6, overshot, slidevert
}
