# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# User Keybinds — Productivity Enhancements (macOS/Windows inspired)
# See https://wiki.hyprland.org/Configuring/Keywords/

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# ╔══════════════════════════════════════════════════════════════╗
# ║  UNBIND DEFAULTS THAT CONFLICT WITH NEW BINDINGS            ║
# ╚══════════════════════════════════════════════════════════════╝

# Unbind arrow keys from movefocus (we'll remap to window snapping)
unbind = $mainMod, left, focus left, movefocus, l
unbind = $mainMod, right, focus right, movefocus, r
unbind = $mainMod, up, focus up, movefocus, u
unbind = $mainMod, down, focus down, movefocus, d

# Unbind default SUPER+D (replace with Spotlight)
unbind = $mainMod, D, app launcher, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window

# Unbind default SUPER+SHIFT+S (replace with grimblast region screenshot)
unbind = $mainMod SHIFT, S, screenshot (swappy), exec, $scriptsDir/ScreenShot.sh --swappy

# Unbind SUPER+ALT+V clipboard (moving to SUPER+V)
unbind = $mainMod ALT, V, clipboard manager, exec, $scriptsDir/ClipManager.sh

# Unbind SUPER+ALT+C calculator (moving to SUPER+SHIFT+C)
unbind = $mainMod ALT, C, calculator, exec, $UserScripts/RofiCalc.sh

# ╔══════════════════════════════════════════════════════════════╗
# ║  🔍 SPOTLIGHT-STYLE LAUNCHER (macOS Cmd+Space)              ║
# ╚══════════════════════════════════════════════════════════════╝

# SUPER+D = Spotlight search (centered, minimal, combined modes)
bindd = $mainMod, D, Spotlight search, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window -config ~/.config/rofi/config-spotlight.rasi

# ╔══════════════════════════════════════════════════════════════╗
# ║  🪟 WINDOWS-STYLE WINDOW SNAPPING                           ║
# ╚══════════════════════════════════════════════════════════════╝

# SUPER+Arrow = Move/snap windows (Windows 11 style)
bindd = $mainMod, Left, snap window left, movewindow, l
bindd = $mainMod, Right, snap window right, movewindow, r
bindd = $mainMod, Up, maximize window, fullscreen, 1
bindd = $mainMod, Down, minimize window, movetoworkspacesilent, special:minimized

# Restore minimized windows
bindd = $mainMod SHIFT, Down, restore minimized windows, togglespecialworkspace, minimized

# Re-add focus movement on ALT+Arrows (since we took SUPER+Arrows)
bindd = $mainMod ALT, Left, focus left, movefocus, l
bindd = $mainMod ALT, Right, focus right, movefocus, r
bindd = $mainMod ALT, Up, focus up, movefocus, u
bindd = $mainMod ALT, Down, focus down, movefocus, d

# ╔══════════════════════════════════════════════════════════════╗
# ║  🔄 ALT+TAB WINDOW SWITCHING                                ║
# ╚══════════════════════════════════════════════════════════════╝

# ALT+TAB = visual window switcher (like Windows/macOS)
bindd = ALT, Tab, switch windows, exec, pkill rofi || true && rofi -show window -config ~/.config/rofi/config-window-switcher.rasi

# ╔══════════════════════════════════════════════════════════════╗
# ║  📋 CLIPBOARD MANAGER (Windows Win+V)                       ║
# ╚══════════════════════════════════════════════════════════════╝

# SUPER+V = clipboard history (like Windows)
bindd = $mainMod, V, clipboard manager, exec, $scriptsDir/ClipManager.sh

# ╔══════════════════════════════════════════════════════════════╗
# ║  📸 SCREENSHOTS (Windows Snipping Tool)                     ║
# ╚══════════════════════════════════════════════════════════════╝

# SUPER+SHIFT+S = region screenshot (Windows Snipping Tool)
bindd = $mainMod SHIFT, S, screenshot region, exec, grimblast --notify --cursor copysave area ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# Print = full screenshot
bindd = , Print, screenshot full, exec, grimblast --notify --cursor copysave screen ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# ╔══════════════════════════════════════════════════════════════╗
# ║  🔔 NOTIFICATION CONTROLS                                   ║
# ╚══════════════════════════════════════════════════════════════╝

# SUPER+CTRL+N = dismiss all notifications
bindd = $mainMod CTRL, N, clear all notifications, exec, swaync-client -C

# ╔══════════════════════════════════════════════════════════════╗
# ║  🛠️ PRODUCTIVITY SHORTCUTS                                  ║
# ╚══════════════════════════════════════════════════════════════╝

# SUPER+SHIFT+C = quick calculator
bindd = $mainMod SHIFT, C, calculator, exec, $UserScripts/RofiCalc.sh

# SUPER+SHIFT+P = color picker (copies to clipboard)
bindd = $mainMod SHIFT, P, color picker, exec, hyprpicker -a -n

# Quick file access
bindd = $mainMod SHIFT, E, open Downloads, exec, thunar ~/Downloads

# ╔══════════════════════════════════════════════════════════════╗
# ║  🖥️ SHOW DESKTOP (macOS/Windows style)                      ║
# ╚══════════════════════════════════════════════════════════════╝

# SUPER+COMMA = toggle show desktop (minimize all / restore all)
bindd = $mainMod, COMMA, show desktop toggle, exec, hyprctl dispatch togglespecialworkspace minimized


# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
