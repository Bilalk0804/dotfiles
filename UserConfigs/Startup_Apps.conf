# Commands and Apps to be executed at launch
exec-once = quickshell -p ~/.config/quickshell/overview/
exec-once = sh -c 'pgrep -x blueman-applet >/dev/null || blueman-applet'

# macOS-style dock (auto-hide, bottom, centered)
exec-once = nwg-dock-hyprland -d -hd 0 -i 48 -mb 6 -ml 8 -mr 8 -p bottom -a center -nolauncher
